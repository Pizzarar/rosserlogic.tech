<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Roster workflow: operator to private network to Paseo daemon to lead to role-scoped team to reviewers to human gates">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L10 5 L0 10 z" fill="#45D6CF"/>
    </marker>
  </defs>

  <rect width="1200" height="640" fill="#141229"/>

  <text x="600" y="30" text-anchor="middle" font-family="'DotGothic16', 'Courier New', monospace" font-size="17" letter-spacing="2" fill="#F3ECDF">ROSTER — MULTI-AGENT WORKFLOW</text>

  <!-- [1] Remote Operator -->
  <rect x="380" y="44" width="440" height="58" rx="5" fill="#1E1C40" stroke="#45D6CF" stroke-width="2"/>
  <text x="600" y="68" text-anchor="middle" font-family="'DotGothic16', 'Courier New', monospace" font-size="14" fill="#F3ECDF">REMOTE OPERATOR</text>
  <text x="600" y="88" text-anchor="middle" font-family="'DotGothic16', 'Courier New', monospace" font-size="11.5" fill="#B8B2D6">Desktop / Phone</text>

  <line x1="600" y1="102" x2="600" y2="124" stroke="#45D6CF" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- [2] Private Encrypted Network -->
  <rect x="380" y="126" width="440" height="58" rx="5" fill="#1E1C40" stroke="#2B2862" stroke-width="2"/>
  <text x="600" y="150" text-anchor="middle" font-family="'DotGothic16', 'Courier New', monospace" font-size="14" fill="#9A7BFF">PRIVATE ENCRYPTED NETWORK</text>
  <text x="600" y="170" text-anchor="middle" font-family="'DotGothic16', 'Courier New', monospace" font-size="11.5" fill="#B8B2D6">no public ports · no public tunnel</text>

  <line x1="600" y1="184" x2="600" y2="206" stroke="#45D6CF" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- [3] Self-hosted Paseo daemon + Roster plugin -->
  <rect x="330" y="208" width="540" height="70" rx="5" fill="#1E1C40" stroke="#FF6FA5" stroke-width="2"/>
  <text x="600" y="232" text-anchor="middle" font-family="'DotGothic16', 'Courier New', monospace" font-size="14" fill="#FF6FA5">SELF-HOSTED PASEO DAEMON + ROSTER PLUGIN</text>
  <text x="600" y="254" text-anchor="middle" font-family="'DotGothic16', 'Courier New', monospace" font-size="11.5" fill="#F3ECDF">client/ · server/ · shared/</text>
  <text x="600" y="271" text-anchor="middle" font-family="'DotGothic16', 'Courier New', monospace" font-size="11" fill="#B8B2D6">lead pins · lead-grouped board · two-tap stop · lead handoffs · worktree cleanup</text>

  <line x1="600" y1="278" x2="600" y2="300" stroke="#45D6CF" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- [4] Lead Agent -->
  <rect x="420" y="302" width="360" height="58" rx="5" fill="#1E1C40" stroke="#FFA552" stroke-width="2"/>
  <text x="600" y="326" text-anchor="middle" font-family="'DotGothic16', 'Courier New', monospace" font-size="14" fill="#FFA552">LEAD AGENT</text>
  <text x="600" y="346" text-anchor="middle" font-family="'DotGothic16', 'Courier New', monospace" font-size="11.5" fill="#B8B2D6">coordinates &amp; dispatches</text>

  <line x1="600" y1="360" x2="600" y2="382" stroke="#45D6CF" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- [5] Role-scoped team -->
  <rect x="90" y="384" width="1020" height="132" rx="6" fill="#1E1C40" stroke="#2B2862" stroke-width="2"/>
  <text x="600" y="404" text-anchor="middle" font-family="'DotGothic16', 'Courier New', monospace" font-size="13" fill="#45D6CF">ROLE-SCOPED TEAM · ISOLATED GIT WORKTREES</text>

  <!-- role chips row 1 -->
  <g font-family="'DotGothic16', 'Courier New', monospace">
    <rect x="106" y="414" width="232" height="44" rx="4" fill="#141229" stroke="#2B2862"/>
    <text x="116" y="430" font-size="12" fill="#F3ECDF">IMPLEMENTERS</text>
    <text x="116" y="447" font-size="10" fill="#B8B2D6">standard · hard · work-order (trial)</text>

    <rect x="350" y="414" width="232" height="44" rx="4" fill="#141229" stroke="#2B2862"/>
    <text x="360" y="440" font-size="12" fill="#F3ECDF">MECHANICAL</text>

    <rect x="594" y="414" width="232" height="44" rx="4" fill="#141229" stroke="#2B2862"/>
    <text x="604" y="440" font-size="12" fill="#F3ECDF">SPEC</text>

    <rect x="838" y="414" width="232" height="44" rx="4" fill="#141229" stroke="#2B2862"/>
    <text x="848" y="440" font-size="12" fill="#F3ECDF">PLANNER</text>
  </g>

  <!-- role chips row 2 -->
  <g font-family="'DotGothic16', 'Courier New', monospace">
    <rect x="106" y="466" width="232" height="40" rx="4" fill="#141229" stroke="#2B2862"/>
    <text x="116" y="491" font-size="12" fill="#F3ECDF">SCOUT</text>

    <rect x="350" y="466" width="232" height="40" rx="4" fill="#141229" stroke="#2B2862"/>
    <text x="360" y="491" font-size="12" fill="#F3ECDF">PRE-CHECK</text>

    <rect x="594" y="466" width="232" height="40" rx="4" fill="#141229" stroke="#2B2862"/>
    <text x="604" y="491" font-size="12" fill="#F3ECDF">AUDIT</text>

    <rect x="838" y="466" width="232" height="40" rx="4" fill="#141229" stroke="#2B2862"/>
    <text x="848" y="486" font-size="11" fill="#F3ECDF">ESCALATION-ONLY</text>
    <text x="848" y="500" font-size="11" fill="#F3ECDF">SENIOR REASONING</text>
  </g>

  <!-- 5 -> 6 -->
  <line x1="330" y1="516" x2="330" y2="542" stroke="#45D6CF" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- [6] Cross-family reviewers -->
  <rect x="90" y="544" width="480" height="72" rx="5" fill="#1E1C40" stroke="#9A7BFF" stroke-width="2"/>
  <text x="330" y="572" text-anchor="middle" font-family="'DotGothic16', 'Courier New', monospace" font-size="13" fill="#9A7BFF">CROSS-FAMILY REVIEWERS</text>
  <text x="330" y="594" text-anchor="middle" font-family="'DotGothic16', 'Courier New', monospace" font-size="11" fill="#F3ECDF">independent model family</text>
  <text x="330" y="610" text-anchor="middle" font-family="'DotGothic16', 'Courier New', monospace" font-size="10.5" fill="#B8B2D6">no model grades its own output</text>

  <!-- 6 -> 7 -->
  <line x1="570" y1="580" x2="628" y2="580" stroke="#45D6CF" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- [7] Staged human gates -->
  <rect x="630" y="544" width="480" height="72" rx="5" fill="#1E1C40" stroke="#7CFF9B" stroke-width="2"/>
  <text x="870" y="570" text-anchor="middle" font-family="'DotGothic16', 'Courier New', monospace" font-size="13" fill="#7CFF9B">STAGED HUMAN GATES</text>
  <text x="870" y="592" text-anchor="middle" font-family="'DotGothic16', 'Courier New', monospace" font-size="12" fill="#F3ECDF">Gate A → Gate B → Gate C</text>
  <text x="870" y="610" text-anchor="middle" font-family="'DotGothic16', 'Courier New', monospace" font-size="10.5" fill="#B8B2D6">HANDOFF.md · DISPATCH_LOG.md</text>
</svg>
