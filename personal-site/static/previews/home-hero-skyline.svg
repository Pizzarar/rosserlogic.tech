    <rect x="960" y="505" width="460" height="14" fill="#FF6FA5"/>
    <rect x="960" y="519" width="460" height="14" fill="#FFA552"/>
    <rect x="960" y="533" width="460" height="15" fill="#FF6FA5"/>
    <rect x="960" y="548" width="460" height="16" fill="#FFA552"/>
    <rect x="960" y="564" width="460" height="17" fill="#FF6FA5"/>
    <rect x="960" y="581" width="460" height="18" fill="#FFA552"/>
    <rect x="960" y="599" width="460" height="19" fill="#FF6FA5"/>
    <rect x="960" y="618" width="460" height="20" fill="#FFA552"/>
    <rect x="960" y="638" width="460" height="21" fill="#FF6FA5"/>
    <rect x="960" y="659" width="460" height="22" fill="#FFA552"/>
    <rect x="960" y="681" width="460" height="23" fill="#FF6FA5"/>
    <rect x="960" y="704" width="460" height="24" fill="#FFA552"/>
    <rect x="960" y="728" width="460" height="25" fill="#FF6FA5"/>
