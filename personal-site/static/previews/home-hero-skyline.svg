    <rect x="960" y="413" width="460" height="10" fill="#FF6FA5"/>
    <rect x="960" y="423" width="460" height="10" fill="#FFA552"/>
    <rect x="960" y="433" width="460" height="11" fill="#FF6FA5"/>
    <rect x="960" y="444" width="460" height="11" fill="#FFA552"/>
    <rect x="960" y="455" width="460" height="12" fill="#FF6FA5"/>
    <rect x="960" y="467" width="460" height="12" fill="#FFA552"/>
