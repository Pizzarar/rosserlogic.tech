    <rect x="590" y="400" width="8" height="10"/><rect x="620" y="470" width="8" height="10"/>
    <rect x="655" y="560" width="8" height="10"/><rect x="820" y="440" width="8" height="10"/>
    <rect x="855" y="520" width="8" height="10"/><rect x="995" y="430" width="8" height="10"/>
    <rect x="1030" y="500" width="8" height="10"/><rect x="1180" y="420" width="8" height="10"/>
    <rect x="1215" y="490" width="8" height="10"/><rect x="1260" y="580" width="8" height="10"/>
