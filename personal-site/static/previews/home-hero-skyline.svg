  <g fill="#CFC6AE">
    <rect x="652" y="810" width="18" height="12"/><rect x="676" y="810" width="18" height="12"/>
    <rect x="700" y="810" width="18" height="12"/><rect x="724" y="810" width="18" height="12"/>
    <rect x="748" y="810" width="18" height="12"/><rect x="772" y="810" width="18" height="12"/>
    <rect x="796" y="810" width="18" height="12"/><rect x="820" y="810" width="18" height="12"/>
    <rect x="844" y="810" width="44" height="12"/>
  </g>
  <rect x="936" y="782" width="40" height="52" rx="4" fill="#E8DFCC" stroke="#12112A" stroke-width="3"/>
  <path d="M936 786 h40" stroke="#9A7BFF" stroke-width="4"/>

  <!-- Venetian blinds -->
  <g>
    <rect x="0" y="0" width="1600" height="8" fill="#9A7BFF"/>
    <rect x="0" y="0" width="1600" height="150" fill="url(#blinds)"/>
    <line x1="120" y1="0" x2="120" y2="150" stroke="#F3ECDF" stroke-width="2" opacity="0.7"/>
    <line x1="120" y1="150" x2="120" y2="180" stroke="#F3ECDF" stroke-width="1.5" opacity="0.6"/>
