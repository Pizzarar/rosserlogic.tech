    <rect x="590" y="80" width="2" height="2"/><rect x="700" y="40" width="2" height="2"/>
    <rect x="840" y="120" width="2" height="2"/><rect x="960" y="70" width="2" height="2"/>
    <rect x="1300" y="95" width="2" height="2"/><rect x="1430" y="60" width="2" height="2"/>
    <rect x="1520" y="150" width="2" height="2"/><rect x="230" y="220" width="2" height="2"/>
