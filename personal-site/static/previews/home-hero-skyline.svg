    <line x1="250" y1="360" x2="250" y2="320"/><line x1="640" y1="340" x2="640" y2="295"/>
    <line x1="1210" y1="350" x2="1210" y2="300"/><line x1="1395" y1="385" x2="1395" y2="345"/>
