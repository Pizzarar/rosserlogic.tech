      <rect x="236" y="398" width="138" height="370"/>
      <rect x="426" y="438" width="88" height="330"/>
      <rect x="566" y="408" width="118" height="360"/>
      <rect x="726" y="453" width="98" height="315"/>
      <rect x="876" y="393" width="148" height="375"/>
      <rect x="1066" y="443" width="108" height="325"/>
      <rect x="1236" y="418" width="118" height="350"/>
      <rect x="1416" y="458" width="98" height="310"/>
      <rect x="1536" y="478" width="58" height="290"/>
    </clipPath>
    <clipPath id="skyline">
      <rect x="8" y="408" width="144" height="360"/>
      <rect x="208" y="368" width="124" height="400"/>
      <rect x="398" y="418" width="104" height="350"/>
      <rect x="568" y="348" width="154" height="420"/>
