  <g fill="#1E1C40">
    <rect x="0" y="400" width="160" height="380"/><rect x="200" y="360" width="140" height="420"/>
    <rect x="390" y="410" width="120" height="370"/><rect x="560" y="340" width="170" height="440"/>
    <rect x="790" y="380" width="130" height="400"/><rect x="970" y="400" width="120" height="380"/>
    <rect x="1140" y="350" width="160" height="430"/><rect x="1350" y="385" width="130" height="395"/>
