    <rect x="170" y="580" width="420" height="180" rx="6" fill="#CFC6AE"/>
    <rect x="188" y="598" width="384" height="144" rx="4" fill="#12112A"/>
    <text x="206" y="676" font-family="'DotGothic16', 'Courier New', monospace" font-size="30" fill="#7CFF9B">&gt; SYSTEM READY</text>
