    <text x="206" y="716" font-family="'DotGothic16', 'Courier New', monospace" font-size="17" fill="#7CFF9B" opacity="0.75">MEMORY 640K OK</text>
    <rect x="188" y="598" width="384" height="144" rx="4" fill="none" stroke="#2B2862" stroke-width="2"/>
    <rect x="210" y="668" width="384" height="2" fill="#7CFF9B" opacity="0.18"/>
    <rect x="210" y="708" width="384" height="2" fill="#7CFF9B" opacity="0.12"/>
    <rect x="340" y="780" width="80" height="30" fill="#CFC6AE"/>
    <rect x="270" y="806" width="220" height="16" rx="5" fill="#E8DFCC" stroke="#12112A" stroke-width="3"/>
  </g>

