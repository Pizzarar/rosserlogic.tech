    <rect x="720" y="445" width="110" height="335"/><rect x="870" y="385" width="160" height="395"/>
    <rect x="1060" y="435" width="120" height="345"/><rect x="1230" y="410" width="130" height="370"/>
    <rect x="1410" y="450" width="110" height="330"/><rect x="1530" y="470" width="90" height="310"/>
