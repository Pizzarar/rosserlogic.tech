[site]
title = "Aubrey Rosser"
description = "Aubrey Rosser: IT support, development, and Idle Minds game studio"
base_url = "http://localhost:3000"
language = "en"
author = "Aubrey Rosser"

[[collections]]
name = "posts"
label = "Posts"
directory = "posts"
has_date = true
has_rss = true
listed = false
url_prefix = "/posts"
nested = false
default_template = "post.html"

[[collections]]
name = "docs"
label = "Documentation"
directory = "docs"
has_date = false
has_rss = false
listed = false
url_prefix = "/docs"
nested = true
default_template = "doc.html"

[[collections]]
name = "pages"
label = "Pages"
directory = "pages"
has_date = false
has_rss = false
listed = false
url_prefix = ""
nested = true
default_template = "page.html"

[build]
output_dir = "dist"
content_dir = "content"
template_dir = "templates"
static_dir = "static"
data_dir = "data"
public_dir = "public"
minify = true

[deploy]
target = "github-pages"
auto_commit = true

[languages]

[images]
widths = [
    480,
    800,
    1200,
]
quality = 80
lazy_loading = true
webp = true
avif_quality = 70

[contact]
provider = "formspree"
endpoint = "mgaalkpw"
